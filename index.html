<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zps165 · 小工具集合</title>
  <meta name="description" content="纯静态小工具集合：Switch 花费账本、工作日志。">
  <meta name="theme-color" content="#f2ede3">
  <link rel="icon" href="./switch-ledger/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f2ede3;
      --bg-soft: #f8f4ec;
      --card: #fffdf8;
      --ink: #17130f;
      --ink-soft: #6b6259;
      --line: #e2d9cb;
      --accent: #e60012;
      --shadow: 0 18px 40px -24px rgba(30, 20, 10, .45);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --bg-soft: #1b1815;
        --card: #221e1a;
        --ink: #f5efe6;
        --ink-soft: #a89d90;
        --line: #35302a;
        --accent: #ff3b45;
        --shadow: 0 18px 40px -24px rgba(0, 0, 0, .8);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: clamp(24px, 6vw, 72px) clamp(18px, 5vw, 48px);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(28px, 5vw, 48px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 480px at 12% -12%, #fbe6e0 0%, transparent 62%),
        radial-gradient(900px 420px at 100% 0%, #eef1e6 0%, transparent 58%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1100px 480px at 12% -12%, #36161a 0%, transparent 62%),
          radial-gradient(900px 420px at 100% 0%, #1e2418 0%, transparent 58%),
          var(--bg);
      }
    }

    .wrap {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 5vw, 44px);
    }

    header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    header .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.1;
      letter-spacing: -.02em;
      font-weight: 800;
    }

    header p {
      margin: 12px 0 0;
      max-width: 46ch;
      color: var(--ink-soft);
      font-size: clamp(14px, 1.6vw, 16px);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(14px, 2.4vw, 20px);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: clamp(20px, 3vw, 26px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .card:hover, .card:focus-within {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card .tag {
      align-self: flex-start;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      background: var(--bg-soft);
    }

    .card h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -.01em;
    }

    .card h2 a {
      color: inherit;
      text-decoration: none;
      outline: none;
    }

    /* 让标题链接铺满整张卡，卡片可点，同时保留卡内的「更新日志」链接 */
    .card h2 a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 1;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.65;
    }

    /* 整卡由标题链接的 ::after 铺满，所以这一行默认不吃点击，
       只有里面的 <a>（更新日志）重新接管指针事件 */
    .foot {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      pointer-events: none;
    }

    .foot a { pointer-events: auto; }

    .go {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .go::after {
      content: "→";
      transition: transform .22s ease;
    }

    .card:hover .go::after { transform: translateX(4px); }

    .meta {
      font-size: 11px;
      color: var(--ink-soft);
    }

    .meta a {
      color: inherit;
      text-underline-offset: 3px;
    }

    .state {
      grid-column: 1 / -1;
      margin: 0;
      padding: clamp(20px, 3vw, 28px);
      border: 1px dashed var(--line);
      border-radius: 22px;
      background: var(--bg-soft);
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.75;
    }

    .state strong { color: var(--ink); }

    .state code {
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .state a { color: var(--accent); }

    footer {
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    footer a { color: inherit; }

    .noscript {
      max-width: 940px;
      margin: 0 auto;
      padding: 16px 20px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: var(--bg-soft);
      font-size: 14px;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow" id="siteEyebrow">Static tools</span>
      <h1 id="siteTitle">小工具集合</h1>
      <p id="siteDescription">纯静态、无后端、数据留在浏览器本地。选择下面任意一个开始。</p>
    </header>

    <main class="grid" id="projects" aria-busy="true" aria-live="polite">
      <p class="state">正在读取项目清单…</p>
    </main>

    <footer>
      <span>由 <a id="repoLink" href="https://github.com/Zps165/Zps165.github.io">Zps165/Zps165.github.io</a> 提供 · GitHub Pages</span>
      <span id="siteCount"></span>
    </footer>
  </div>

  <noscript>
    <p class="noscript">
      首页的项目卡片由 <code>projects.json</code> 动态生成，需要开启 JavaScript。
      也可以直接访问 <a href="./switch-ledger/">switch-ledger/</a> 或 <a href="./worklog/">worklog/</a>。
    </p>
  </noscript>

  <script>
    (function () {
      'use strict';

      var grid = document.getElementById('projects');
      var countEl = document.getElementById('siteCount');
      var repoLink = document.getElementById('repoLink');

      var ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return ESCAPES[ch];
        });
      }

      /** 目录名 → 相对地址，容忍 "./foo/"、"foo"、"foo/" 等写法 */
      function dirToHref(dir) {
        var clean = String(dir || '').replace(/^\.\//, '').replace(/\/+$/, '');
        return './' + clean + '/';
      }

      function pickText(el, value) {
        if (el && typeof value === 'string' && value.trim()) el.textContent = value.trim();
      }

      function metaHtml(project, repo) {
        var bits = [];
        if (project.version) bits.push('v' + esc(project.version));
        if (project.updated) bits.push('更新于 ' + esc(project.updated));
        if (!bits.length) return '';

        var text = esc(bits.join(' · '));
        if (project.changelog && repo) {
          var base = String(repo).replace(/\/+$/, '');
          var href = base + '/blob/master/' + String(project.changelog).replace(/^\.?\//, '');
          text += ' · <a href="' + esc(href) + '" target="_blank" rel="noopener">更新日志</a>';
        }
        return '<div class="meta">' + text + '</div>';
      }

      function cardHtml(project, repo) {
        var href = dirToHref(project.dir);
        var name = esc(project.name || project.dir);
        var tag = project.tag ? '<span class="tag">' + esc(project.tag) + '</span>' : '';
        var desc = project.description ? '<p>' + esc(project.description) + '</p>' : '';
        var cta = esc(project.cta || ('打开 ' + (project.name || project.dir)));

        return '' +
          '<article class="card">' +
            tag +
            '<h2><a href="' + esc(href) + '">' + name + '</a></h2>' +
            desc +
            '<div class="foot">' +
              '<span class="go">' + cta + '</span>' +
              metaHtml(project, repo) +
            '</div>' +
          '</article>';
      }

      function render(data) {
        var projects = Array.isArray(data) ? data : (data && data.projects);
        if (!Array.isArray(projects)) throw new Error('projects.json 里没有 projects 数组');

        var repo = (data && data.repo) || (repoLink && repoLink.href) || '';
        var site = (data && data.site) || {};
        pickText(document.getElementById('siteTitle'), site.title);
        pickText(document.getElementById('siteEyebrow'), site.eyebrow);
        pickText(document.getElementById('siteDescription'), site.description);
        if (repo && repoLink) repoLink.href = repo;

        var visible = projects
          .filter(function (p) { return p && !p.hidden && p.dir; })
          .sort(function (a, b) {
            var oa = typeof a.order === 'number' ? a.order : 999;
            var ob = typeof b.order === 'number' ? b.order : 999;
            return oa - ob;
          });

        if (!visible.length) {
          grid.innerHTML = '<p class="state">清单是空的：在 <code>projects.json</code> 里加一条就会出现在这里。</p>';
        } else {
          grid.innerHTML = visible.map(function (p) { return cardHtml(p, repo); }).join('');
        }

        grid.removeAttribute('aria-busy');
        if (countEl) countEl.textContent = '共 ' + visible.length + ' 个工具';
      }

      function fail(error) {
        grid.removeAttribute('aria-busy');
        grid.innerHTML = '' +
          '<p class="state">' +
            '<strong>没能读到项目清单</strong>（<code>projects.json</code>）。<br>' +
            '原因：' + esc(error && error.message ? error.message : error) + '<br>' +
            '如果是从硬盘直接打开（<code>file://</code>），浏览器会拦下这次请求，请改用本地服务器访问；' +
            '线上环境刷新一次通常就好了。' +
          '</p>';
      }

      // cache: 'no-cache' —— 每次都向服务器校验，避免改完 projects.json 还看到旧清单
      fetch('./projects.json', { cache: 'no-cache' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(render)
        .catch(fail);
    })();
  </script>
</body>
</html>
