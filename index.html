<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zps165 · 小工具集合</title>
  <meta name="description" content="纯静态小工具集合：Switch 花费账本、工作日志。">
  <meta name="theme-color" content="#f2ede3">
  <link rel="icon" href="./switch-ledger/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f2ede3;
      --bg-soft: #f8f4ec;
      --card: #fffdf8;
      --ink: #17130f;
      --ink-soft: #6b6259;
      --line: #e2d9cb;
      --accent: #e60012;
      --shadow: 0 18px 40px -24px rgba(30, 20, 10, .45);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --bg-soft: #1b1815;
        --card: #221e1a;
        --ink: #f5efe6;
        --ink-soft: #a89d90;
        --line: #35302a;
        --accent: #ff3b45;
        --shadow: 0 18px 40px -24px rgba(0, 0, 0, .8);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: clamp(24px, 6vw, 72px) clamp(18px, 5vw, 48px);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(28px, 5vw, 48px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 480px at 12% -12%, #fbe6e0 0%, transparent 62%),
        radial-gradient(900px 420px at 100% 0%, #eef1e6 0%, transparent 58%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1100px 480px at 12% -12%, #36161a 0%, transparent 62%),
          radial-gradient(900px 420px at 100% 0%, #1e2418 0%, transparent 58%),
          var(--bg);
      }
    }

    .wrap {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(28px, 5vw, 44px);
    }

    header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    header .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.1;
      letter-spacing: -.02em;
      font-weight: 800;
    }

    header p {
      margin: 12px 0 0;
      max-width: 46ch;
      color: var(--ink-soft);
      font-size: clamp(14px, 1.6vw, 16px);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(14px, 2.4vw, 20px);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: clamp(20px, 3vw, 26px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      outline: none;
    }

    .card .tag {
      align-self: flex-start;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      background: var(--bg-soft);
    }

    .card h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -.01em;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.65;
    }

    .card .go {
      margin-top: auto;
      padding-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card .go::after {
      content: "→";
      transition: transform .22s ease;
    }

    .card:hover .go::after { transform: translateX(4px); }

    footer {
      font-size: 12px;
      color: var(--ink-soft);
    }

    footer a { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">Static tools</span>
      <h1>小工具集合</h1>
      <p>纯静态、无后端、数据留在浏览器本地。选择下面任意一个开始。</p>
    </header>

    <main class="grid">
      <a class="card" href="./switch-ledger/">
        <span class="tag">PWA · 账本</span>
        <h2>Switch 花费账本</h2>
        <p>记录卡带、配件、点卡的现金支出与 eShop 数字版游戏，按区服维护余额，自动折算净花费。可安装、可离线。</p>
        <span class="go">打开 Cart Log</span>
      </a>

      <a class="card" href="./worklog/">
        <span class="tag">PWA · 工时</span>
        <h2>工时记</h2>
        <p>记录白夜班工时、休息与请假，按工作日 / 休息日 / 法定节假日分档计算加班费，内置 2025–2027 节假日安排。</p>
        <span class="go">打开工时记</span>
      </a>
    </main>

    <footer>
      由 <a href="https://github.com/Zps165/Zps165.github.io">Zps165/Zps165.github.io</a> 提供 · GitHub Pages
    </footer>
  </div>
</body>
</html>
